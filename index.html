<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1>Expense Tracker</h1>
      <p class="subtitle">Track your spending with ease</p>
    </header>

    <!-- Summary Cards -->
    <section class="summary">
      <div class="card card--total">
        <span class="card__label">Total Spent</span>
        <span class="card__amount" id="totalAmount">$0.00</span>
      </div>
      <div class="card card--month">
        <span class="card__label">This Month</span>
        <span class="card__amount" id="monthAmount">$0.00</span>
      </div>
      <div class="card card--count">
        <span class="card__label">Transactions</span>
        <span class="card__amount" id="totalCount">0</span>
      </div>
    </section>

    <!-- Main Content -->
    <main class="main">
      <!-- Add Expense Form -->
      <section class="form-section">
        <h2 class="section-title">Add Expense</h2>
        <form class="form" id="expenseForm">
          <div class="form__row">
            <div class="form__group">
              <label for="description">Description</label>
              <input type="text" id="description" placeholder="e.g. Coffee, Rent, Netflix" required />
            </div>
            <div class="form__group">
              <label for="amount">Amount ($)</label>
              <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required />
            </div>
          </div>
          <div class="form__row">
            <div class="form__group">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="">Select category</option>
                <option value="Food &amp; Dining">Food &amp; Dining</option>
                <option value="Transport">Transport</option>
                <option value="Housing">Housing</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Shopping">Shopping</option>
                <option value="Utilities">Utilities</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form__group">
              <label for="date">Date</label>
              <input type="date" id="date" required />
            </div>
          </div>
          <button type="submit" class="btn btn--primary">Add Expense</button>
        </form>
      </section>

      <!-- Expense List -->
      <section class="list-section">
        <div class="list-header">
          <h2 class="section-title">Expenses</h2>
          <div class="list-controls">
            <select id="filterCategory" class="filter-select">
              <option value="">All Categories</option>
              <option value="Food &amp; Dining">Food &amp; Dining</option>
              <option value="Transport">Transport</option>
              <option value="Housing">Housing</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Shopping">Shopping</option>
              <option value="Utilities">Utilities</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
            <button class="btn btn--danger btn--sm" id="clearAllBtn">Clear All</button>
          </div>
        </div>

        <div id="expenseList" class="expense-list">
          <div class="empty-state" id="emptyState">
            <div class="empty-state__icon">💸</div>
            <p>No expenses yet. Add one above!</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Category Breakdown -->
    <section class="breakdown-section" id="breakdownSection" style="display:none">
      <h2 class="section-title">Category Breakdown</h2>
      <div class="breakdown-list" id="breakdownList"></div>
    </section>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <p>Delete this expense?</p>
      <div class="modal__actions">
        <button class="btn btn--secondary" id="cancelDelete">Cancel</button>
        <button class="btn btn--danger" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
